# ── MOLAR AI — Netlify deploy configuration ───────────────────────────────────

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# Reports Lighthouse on every deploy. Intentionally threshold-free: it should
# surface regressions in the deploy log, not block a release.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

# ── Security headers (every response) ─────────────────────────────────────────
# CSP notes:
#   script-src  'unsafe-inline' is required for the JSON-LD blocks and the
#               no-flash bootstrap in <head>. All executable code is bundled
#               and served from 'self'; there are no third-party script hosts.
#   style-src   'unsafe-inline' covers Astro's hoisted critical CSS.
#   No external origins are allowed at all — fonts, media and images are
#   self-hosted, so every fetch directive stays locked to 'self'.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # `fullscreen` names Vimeo explicitly: the player's own fullscreen button
    # lives inside its iframe, and `fullscreen=(self)` alone denies it there —
    # the control renders and does nothing.
    Permissions-Policy = "accelerometer=(), autoplay=(self), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self \"https://player.vimeo.com\"), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=()"
    # Vimeo carries the video library. `frame-src` is the one that matters — the
    # player is an iframe, and without it the directive falls back to
    # `default-src 'self'` and the embed is blocked outright. `script-src` covers
    # player.js where the page drives the player from the parent frame, and
    # `img-src` the poster frames served off Vimeo's CDN. Nothing else is needed:
    # the iframe's own requests answer to Vimeo's CSP, not this one.
    #
    # Vimeo is the ONLY third party in here. Four `google` origins were added for
    # a Google Translate control in the nav and removed with it — do not put them
    # back without the widget, and do not leave them behind if it is dropped
    # again. A CSP that allows origins nothing requests is a wider hole than the
    # site needs for no benefit.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://player.vimeo.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.vimeocdn.com; media-src 'self'; frame-src https://player.vimeo.com; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests"

# ── Immutable, content-hashed build output ────────────────────────────────────
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Static media in public/ ───────────────────────────────────────────────────
# Filenames here are stable rather than hashed, so cache for a year and bust by
# renaming the file (hero.mp4 -> hero-v2.mp4) when the creative changes.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pdfs/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
    X-Robots-Tag = "noindex"
    Content-Disposition = "attachment"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── HTML: always revalidate, but serve instantly from the edge ────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap-*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

# ── Redirects ─────────────────────────────────────────────────────────────────
# Enforce the canonical apex host so canonicals, sitemap and served URLs agree.
[[redirects]]
  from = "https://www.molarai.studio/*"
  to = "https://molarai.studio/:splat"
  status = 301
  force = true

# Pricing has been a page of its own since the plans moved off the home page,
# and the home page no longer carries an id="pricing" for the old fragment to
# land on. Send the slashless shorthand at the real route instead.
[[redirects]]
  from = "/pricing"
  to = "/pricing/"
  status = 301

# The FAQ is still a section of the home page — id="faq", rendered by
# ~/components/sections/Faq.astro. Verify this target exists before removing
# that section from the page.
[[redirects]]
  from = "/faq"
  to = "/#faq"
  status = 301

# The product routes, so a shorthand or a slashless link lands on the page
# rather than on the 404. Every "to" here is a real route; check dist/ before
# adding another.
[[redirects]]
  from = "/social"
  to = "/social-media/"
  status = 301

[[redirects]]
  from = "/education"
  to = "/patient-education/"
  status = 301

[[redirects]]
  from = "/tv"
  to = "/molar-tv/"
  status = 301

[[redirects]]
  from = "/complete"
  to = "/molar-complete/"
  status = 301

# /customers/ is gone. Its four evidence sections — the story cards, the growth
# exhibit, the written cases and the inbound DMs — now run on /social-media/,
# which is what they were always arguing for. 301 rather than a 404 because the
# page was in the nav and is linked from the footer of anything already indexed.
[[redirects]]
  from = "/customers"
  to = "/social-media/"
  status = 301

[[redirects]]
  from = "/customers/*"
  to = "/social-media/"
  status = 301

# The German tree is gone — one set of copy, with Google's translation widget in
# the nav for everything else. Anything indexed under /de/ lands on the English
# page it mirrored rather than on the 404.
[[redirects]]
  from = "/de/*"
  to = "/:splat"
  status = 301

# No 404 rule: Astro emits 404.astro as /404.html at the publish root even under
# build.format = "directory", and Netlify serves that automatically for any
# unmatched path. Confirm dist/404.html exists after the first build.
